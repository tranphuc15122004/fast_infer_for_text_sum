# MR-DFlash 4-stage, parameter budget gần DFlash-5L trên Llama 3.1 8B.
# Target benchmark: meta-llama/Meta-Llama-3.1-8B-Instruct.
# Khi server dùng snapshot local, override --target-model-path bằng MODEL_TARGET.
run_id: mr-dflash-llama3-1-8b-4stage
output_dir: outputs/mr-dflash-llama3-1-8b-4stage

model:
  target_model_path: meta-llama/Meta-Llama-3.1-8B-Instruct
  architecture: mr_dflash
  # MR depth nằm ở mr_num_stages; field này giữ schema builder tương thích.
  draft_num_hidden_layers: 1
  # Đồng nhất với DFlash/Qwen benchmark: draft block = 16.
  block_size: 16
  mask_token_id: 128002
  # Match MLP width của DFlash Llama gốc để so parameter budget.
  draft_intermediate_size: 12288
  # Target MLP là 14336 nên không init trực tiếp MLP vào draft 12288.
  init_draft_from_target: false
  draft_checkpoint_path: null
  torch_dtype: bfloat16
  # Cùng feature contract với DFlash-5L gốc.
  feature_layer_ids: [1, 8, 15, 22, 29]
  draft_init_layer_ids: [16]
  mr_stage_init_layer_ids: [1, 10, 20, 29]
  mr_num_stages: 4
  hca_compression_ratio: 128
  csa_compression_ratio: 4
  memory_local_window: 128
  csa_top_k: 64
  # Giữ indexer width = hidden size để không tăng chi phí retrieval.
  indexer_dim: 4096
  indexer_num_heads: 1

data:
  feature_mode: offline
  train_data_path: ./data/user_prompts.jsonl
  eval_data_path: null
  hidden_states_path: /workspace/storage-shared/nlp/dungdx4/phuc_projects/data/mr_dflash_pilot/target_features_llama3_1_8b_3k/train
  eval_hidden_states_path: /workspace/storage-shared/nlp/dungdx4/phuc_projects/data/mr_dflash_pilot/target_features_llama3_1_8b_3k/val
  max_length: 3072
  chat_template: llama
  cache_dir: ./cache
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

training:
  strategy: mr_dflash
  num_epochs: 6
  max_steps: 10000
  # B200 100 GB: local batch thấp để giữ headroom và đồng nhất baseline;
  # effective batch vẫn bằng 4 như protocol cũ.
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 7.0
  # B200 100 GB: giảm đỉnh activation/lm_head; không đổi objective.
  objective_chunk_blocks: 64
  attention_backend: sdpa
  loss_type: dflash
  indexer_train_mode: schedule
  indexer_dense_steps: 1000
  save_interval: 1000
  log_interval: 10
  eval_interval: 0
  dp_world_size: 1
  seed: 42
