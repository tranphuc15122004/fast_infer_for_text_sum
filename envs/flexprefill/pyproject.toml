# Env group: FlexPrefill (torch 2.4.0, triton 3.0.0, transformers 4.44.0)
# FlexPrefill sparse attention (ICLR 2025) — README pins these versions.
[project]
name = "env-flexprefill"
version = "0.1.0"
description = "Dependency env for the FlexPrefill baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.4.0",
    "transformers==4.44.0",
    "triton==3.0.0",
    "einops",
    "accelerate",
    "numpy<2",
    "tqdm",
    "setuptools",
    "wheel",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
