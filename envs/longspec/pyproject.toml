# Env: LongSpec (transformers 4.46.3 + triton 3.1.0)
[project]
name = "env-longspec"
version = "0.1.0"
description = "Dependency env for LongSpec baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "datasets==2.19.1",
    "triton==3.1.0",
    "liger-kernel==0.3.1",
    "tqdm",
    "einops",
    "safetensors",
    "sentencepiece",
    "accelerate",
    "numpy<2",
    "setuptools",
    "wheel",
]

[project.optional-dependencies]
flash = ["flash-attn==2.6.3"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
