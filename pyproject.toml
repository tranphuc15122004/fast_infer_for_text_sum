[project]
name = "fast-infer-text-sum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "deepspeed>=0.19.4",
    "dflash",
    "fastchat>=0.1.0",
    "loguru>=0.7.3",
    "mlx-lm>=0.31.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "shortuuid>=1.0.13",
    "torch",
    "torchvision",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]

[tool.uv.sources]
dflash = { path = "externals/dflash", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
